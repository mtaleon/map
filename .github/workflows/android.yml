name: Android Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore 2>/dev/null \
              || printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            test -s android/app/release.keystore || (echo "ERROR: decoded keystore missing/empty" && exit 1)
            echo "Keystore decoded successfully"
          else
            echo "ERROR: No KEYSTORE_BASE64 secret found"
            exit 1
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: map-coloring-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Build signed release AAB (Play Store)
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: map-coloring-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload release AAB
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: map-coloring-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          body: |
            ## Android Release

            **Play Store**: Upload the `.aab` file to Play Console (manual upload required)
            **Sideload**: Install the `.apk` file directly

            ⚠️ Note: Creating this GitHub Release does NOT publish to Google Play.
            The `.aab` must still be uploaded manually to Play Console.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
